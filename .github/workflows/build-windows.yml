name: Build Windows executable

on:
  workflow_dispatch:        # build on demand from the Actions tab
  push:
    tags: ["v*"]            # and automatically for a release tag

jobs:
  build:
    runs-on: windows-latest

    # Needed only by the release step; the default token is read-only.
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # A floor rather than an exact pin: 6.22.2 is the version verified
          # against numpy 2.4, and the hooks have to keep pace with whatever
          # requirements.txt resolves to later.
          pip install "pyinstaller>=6.22.2"
          python -c "import PyInstaller, numpy; print('PyInstaller', PyInstaller.__version__, '| numpy', numpy.__version__)"

      - name: Build
        run: pyinstaller --noconfirm --clean transcriber.spec

      # The launcher is bundled without the CUDA libraries, which would add
      # roughly 2 GB and push the download past what a release asset allows.
      # It runs on the CPU; install.bat gpu is the path for GPU acceleration.
      - name: Stage the release folder
        shell: pwsh
        run: |
          Copy-Item README.md dist/RU-KK-Transcriber/
          @"
          Mixed Russian / Kazakh Transcriber
          ==================================

          Double-click RU-KK-Transcriber.exe. A console window opens and your
          browser follows a moment later. Keep the console open while you work.

          The first transcription downloads the speech model (about 3 GB) into a
          "data" folder next to the executable. After that the app works offline.

          This build runs on the CPU, which is roughly real time on the large
          model. For GPU acceleration, clone the repository and use
          "install.bat gpu" instead -- see README.md.
          "@ | Out-File -Encoding utf8 dist/RU-KK-Transcriber/READ-ME-FIRST.txt

      - name: Check the build actually starts
        shell: pwsh
        run: |
          # Capture the app's own output so a startup crash is readable here
          # instead of showing up only as a timeout.
          $p = Start-Process -PassThru -FilePath dist/RU-KK-Transcriber/RU-KK-Transcriber.exe `
                 -RedirectStandardOutput app-stdout.txt -RedirectStandardError app-stderr.txt

          $ok = $false
          for ($i = 0; $i -lt 20; $i++) {
            Start-Sleep -Seconds 3
            if ($p.HasExited) { break }
            foreach ($port in 8000..8004) {
              try {
                $r = Invoke-WebRequest "http://127.0.0.1:$port/api/system" -TimeoutSec 3 -UseBasicParsing
                if ($r.StatusCode -eq 200) {
                  $ok = $true
                  Write-Host "Answered on port $port."
                  Write-Host $r.Content
                  break
                }
              } catch { }
            }
            if ($ok) { break }
          }

          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue

          Write-Host "--- the app's stdout ---"
          if (Test-Path app-stdout.txt) { Get-Content app-stdout.txt }
          Write-Host "--- the app's stderr ---"
          if (Test-Path app-stderr.txt) { Get-Content app-stderr.txt }

          if (-not $ok) { throw "The packaged app did not serve /api/system." }
          Write-Host "The packaged app started and answered."

      - name: Check an upload reaches disk
        shell: pwsh
        run: |
          # /api/system is a GET, so it exercises neither multipart parsing nor the
          # frozen build's data directory — which sits next to the executable and
          # has to be writable. Post a real file to cover both.
          $p = Start-Process -PassThru -FilePath dist/RU-KK-Transcriber/RU-KK-Transcriber.exe `
                 -RedirectStandardOutput up-stdout.txt -RedirectStandardError up-stderr.txt

          # One second of silent 16 kHz mono PCM.
          $sr = 16000; $dataLen = $sr * 2
          $ms = New-Object System.IO.MemoryStream
          $bw = New-Object System.IO.BinaryWriter($ms)
          $bw.Write([byte[]][char[]]"RIFF"); $bw.Write([int](36 + $dataLen))
          $bw.Write([byte[]][char[]]"WAVE"); $bw.Write([byte[]][char[]]"fmt ")
          $bw.Write([int]16); $bw.Write([int16]1); $bw.Write([int16]1)
          $bw.Write([int]$sr); $bw.Write([int]($sr * 2)); $bw.Write([int16]2); $bw.Write([int16]16)
          $bw.Write([byte[]][char[]]"data"); $bw.Write([int]$dataLen)
          $bw.Write((New-Object byte[] $dataLen))
          $bw.Flush()
          [System.IO.File]::WriteAllBytes("$PWD/probe.wav", $ms.ToArray())

          $base = $null
          for ($i = 0; $i -lt 20; $i++) {
            Start-Sleep -Seconds 3
            if ($p.HasExited) { break }
            foreach ($port in 8000..8004) {
              try {
                $r = Invoke-WebRequest "http://127.0.0.1:$port/api/system" -TimeoutSec 3 -UseBasicParsing
                if ($r.StatusCode -eq 200) { $base = "http://127.0.0.1:$port"; break }
              } catch { }
            }
            if ($base) { break }
          }
          if (-not $base) {
            Get-Content up-stdout.txt, up-stderr.txt -ErrorAction SilentlyContinue
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
            throw "The app did not come up for the upload check."
          }

          try {
            $resp = Invoke-RestMethod "$base/api/upload" -Method Post -Form @{ file = Get-Item probe.wav }
          } catch {
            Get-Content up-stdout.txt, up-stderr.txt -ErrorAction SilentlyContinue
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
            throw "Upload failed: $_"
          }
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue

          Write-Host "Upload response: $($resp | ConvertTo-Json -Compress)"
          if (-not $resp.job_id) { throw "The upload returned no job id." }
          if ([math]::Abs($resp.duration - 1.0) -gt 0.2) {
            throw "Expected a 1 s file, got $($resp.duration) s -- the bundled ffmpeg did not decode it."
          }
          $stored = Get-ChildItem dist/RU-KK-Transcriber/data/uploads -ErrorAction SilentlyContinue
          if (-not $stored) { throw "Nothing was written to the data folder beside the executable." }
          Write-Host "Stored beside the exe: $($stored.Name -join ', ')"

      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path dist/RU-KK-Transcriber/* -DestinationPath RU-KK-Transcriber-windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: RU-KK-Transcriber-windows
          path: RU-KK-Transcriber-windows.zip

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: RU-KK-Transcriber-windows.zip
          body: |
            Download `RU-KK-Transcriber-windows.zip`, unzip it, and double-click
            `RU-KK-Transcriber.exe`. No Python install needed.

            This build runs on the CPU. For GPU acceleration, clone the repository
            and run `install.bat gpu`.
