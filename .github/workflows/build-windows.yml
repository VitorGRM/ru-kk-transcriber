name: Build Windows executable

on:
  workflow_dispatch:        # build on demand from the Actions tab
  push:
    tags: ["v*"]            # and automatically for a release tag

jobs:
  build:
    runs-on: windows-latest

    # Needed only by the release step; the default token is read-only.
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # A floor rather than an exact pin: 6.22.2 is the version verified
          # against numpy 2.4, and the hooks have to keep pace with whatever
          # requirements.txt resolves to later.
          pip install "pyinstaller>=6.22.2"
          python -c "import PyInstaller, numpy; print('PyInstaller', PyInstaller.__version__, '| numpy', numpy.__version__)"

      - name: Build
        run: pyinstaller --noconfirm --clean transcriber.spec

      # The launcher is bundled without the CUDA libraries, which would add
      # roughly 2 GB and push the download past what a release asset allows.
      # It runs on the CPU; the app offers a one-click GPU download instead.
      - name: Stage the release folder
        shell: pwsh
        run: |
          Copy-Item README.md dist/RU-KK-Transcriber/
          @"
          Mixed Russian / Kazakh Transcriber
          ==================================

          Double-click RU-KK-Transcriber.exe. The app opens in its own window.
          There is no browser and nothing to install first.

          The window is drawn by the Microsoft WebView2 runtime, which Windows 11
          and most of Windows 10 already have. If yours does not, the app fetches
          it from Microsoft on the first launch -- about 2 MB, no admin rights.

          The first transcription downloads the speech model (about 3 GB) into a
          "data" folder next to the executable. After that the app is fully
          offline: no account, no internet, nothing leaves this computer.

          If anything goes wrong, data\logs\app.log next to the executable says
          what.

          This build runs on the CPU, which is roughly real time on the large
          model. If you have an NVIDIA GPU, the app offers a one-click download
          of the CUDA runtime -- see README.md.
          "@ | Out-File -Encoding utf8 dist/RU-KK-Transcriber/READ-ME-FIRST.txt

      # TA_UI=none keeps the app headless for both checks below. The runner has
      # no interactive desktop to put a window on, and a window nobody can close
      # would hang the job.
      - name: Check the build starts and carries a window backend
        shell: pwsh
        env:
          TA_UI: none
        run: |
          $exe = "dist/RU-KK-Transcriber/RU-KK-Transcriber.exe"
          $log = "dist/RU-KK-Transcriber/data/logs/app.log"
          $p = Start-Process -PassThru -FilePath $exe

          $info = $null
          for ($i = 0; $i -lt 20; $i++) {
            Start-Sleep -Seconds 3
            if ($p.HasExited) { break }
            foreach ($port in 8000..8004) {
              try {
                $r = Invoke-WebRequest "http://127.0.0.1:$port/api/system" -TimeoutSec 3 -UseBasicParsing
                if ($r.StatusCode -eq 200) {
                  $info = $r.Content | ConvertFrom-Json
                  Write-Host "Answered on port $port."
                  break
                }
              } catch { }
            }
            if ($info) { break }
          }

          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue

          # The build has no console, so its output lives in the log file.
          Write-Host "--- data/logs/app.log ---"
          if (Test-Path $log) { Get-Content $log } else { Write-Host "(no log written)" }

          if (-not $info) { throw "The packaged app did not serve /api/system." }

          # The whole point of this release is that it needs no browser, so a
          # build whose window backend did not survive packaging is a failure
          # even though the server answers perfectly well.
          $d = $info.desktop
          Write-Host "Desktop backend: $($d | ConvertTo-Json -Compress)"
          if (-not $d.native_window) {
            throw "The packaged build cannot open a native window: $($d.reason)"
          }
          Write-Host "The packaged app started, and its window backend is $($d.backend)."

      - name: Check an upload reaches disk
        shell: pwsh
        env:
          TA_UI: none
        run: |
          # /api/system is a GET, so it exercises neither multipart parsing nor the
          # frozen build's data directory — which sits next to the executable and
          # has to be writable. Post a real file to cover both.
          $exe = "dist/RU-KK-Transcriber/RU-KK-Transcriber.exe"
          $log = "dist/RU-KK-Transcriber/data/logs/app.log"
          $p = Start-Process -PassThru -FilePath $exe

          # One second of silent 16 kHz mono PCM.
          $sr = 16000; $dataLen = $sr * 2
          $ms = New-Object System.IO.MemoryStream
          $bw = New-Object System.IO.BinaryWriter($ms)
          $bw.Write([byte[]][char[]]"RIFF"); $bw.Write([int](36 + $dataLen))
          $bw.Write([byte[]][char[]]"WAVE"); $bw.Write([byte[]][char[]]"fmt ")
          $bw.Write([int]16); $bw.Write([int16]1); $bw.Write([int16]1)
          $bw.Write([int]$sr); $bw.Write([int]($sr * 2)); $bw.Write([int16]2); $bw.Write([int16]16)
          $bw.Write([byte[]][char[]]"data"); $bw.Write([int]$dataLen)
          $bw.Write((New-Object byte[] $dataLen))
          $bw.Flush()
          [System.IO.File]::WriteAllBytes("$PWD/probe.wav", $ms.ToArray())

          $base = $null
          for ($i = 0; $i -lt 20; $i++) {
            Start-Sleep -Seconds 3
            if ($p.HasExited) { break }
            foreach ($port in 8000..8004) {
              try {
                $r = Invoke-WebRequest "http://127.0.0.1:$port/api/system" -TimeoutSec 3 -UseBasicParsing
                if ($r.StatusCode -eq 200) { $base = "http://127.0.0.1:$port"; break }
              } catch { }
            }
            if ($base) { break }
          }
          if (-not $base) {
            if (Test-Path $log) { Get-Content $log }
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
            throw "The app did not come up for the upload check."
          }

          try {
            $resp = Invoke-RestMethod "$base/api/upload" -Method Post -Form @{ file = Get-Item probe.wav }
            # Exports are what the desktop window saves through a native dialog,
            # so the endpoint behind that has to work in the packaged build too.
            $seg = '[{"start":0.0,"end":1.0,"text":"тест","language":"kk"}]'
            $srt = Invoke-RestMethod "$base/api/export" -Method Post -Form @{
              job_id = $resp.job_id; fmt = "srt"; segments = $seg }
          } catch {
            if (Test-Path $log) { Get-Content $log }
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
            throw "Upload or export failed: $_"
          }
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue

          Write-Host "Upload response: $($resp | ConvertTo-Json -Compress)"
          if (-not $resp.job_id) { throw "The upload returned no job id." }
          if ([math]::Abs($resp.duration - 1.0) -gt 0.2) {
            throw "Expected a 1 s file, got $($resp.duration) s -- the bundled ffmpeg did not decode it."
          }
          if ($srt -notmatch "00:00:00,000") { throw "The SRT export came back wrong: $srt" }
          Write-Host "Export produced valid SRT."
          $stored = Get-ChildItem dist/RU-KK-Transcriber/data/uploads -ErrorAction SilentlyContinue
          if (-not $stored) { throw "Nothing was written to the data folder beside the executable." }
          Write-Host "Stored beside the exe: $($stored.Name -join ', ')"

      # The smoke tests leave uploads, logs and a probe file behind; shipping
      # them would put someone else's test data in the download.
      - name: Clean up what the checks wrote
        shell: pwsh
        run: Remove-Item -Recurse -Force dist/RU-KK-Transcriber/data -ErrorAction SilentlyContinue

      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path dist/RU-KK-Transcriber/* -DestinationPath RU-KK-Transcriber-windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: RU-KK-Transcriber-windows
          path: RU-KK-Transcriber-windows.zip

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: RU-KK-Transcriber-windows.zip
          body: |
            Download `RU-KK-Transcriber-windows.zip`, unzip it, and double-click
            `RU-KK-Transcriber.exe`. No Python, no browser, nothing to install.

            The app opens in its own window. Windows 11 and most Windows 10
            machines already have the WebView2 runtime it draws with; if yours
            does not, the app fetches it from Microsoft on the first launch.

            The first transcription downloads the speech model (about 3 GB).
            Everything after that runs offline on your own computer.

            This build runs on the CPU. If you have an NVIDIA GPU, the app can
            download the CUDA runtime for you in one click.
